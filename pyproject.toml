[project]
name = "codeprov"
version = "0.1.0"
description = "Reproducible declared-AI provenance, code-quality, SZZ and review research"
requires-python = ">=3.11,<3.14"
dependencies = ["pydriller>=2.7,<3", "radon>=6,<7", "bandit>=1.8,<2", "semgrep>=1.100,<2", "statsmodels>=0.14,<0.16", "pandas>=2.2,<3", "httpx>=0.28,<1"]

[project.scripts]
codeprov = "codeprov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codeprov"]
